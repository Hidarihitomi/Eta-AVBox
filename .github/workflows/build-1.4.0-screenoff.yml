name: Build 1.4.0 (pause allows screen off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream AVBox v1.4.0
        uses: actions/checkout@v7
        with:
          repository: XiaochangXu/AVBox
          ref: v1.4.0
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10 (Chaquopy)
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install SDK 37 / NDK 27.2.12479018
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          ALL="$("$SDKMANAGER" --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n1 || true)"
          NDK="$(echo "$ALL" | grep -oE 'ndk;27\.2\.12479018' | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          ARGS=("$PLATFORM" "$NDK")
          [ -n "$BUILD_TOOLS" ] && ARGS+=("$BUILD_TOOLS")
          "$SDKMANAGER" "${ARGS[@]}"

      - name: Drop theme-level keepScreenOn
        run: |
          set -euo pipefail
          sed -i '/android:keepScreenOn/d' app/src/main/res/values/styles.xml
          grep -c 'keepScreenOn' app/src/main/res/values/styles.xml || true
          sed -n '1,40p' app/src/main/res/values/styles.xml
          sed -i 's/versionName = "1.3.0"/versionName = "1.4.0"/' app/build.gradle.kts
          grep -n 'versionName' app/build.gradle.kts

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -r | head -n1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/AVBox_release.apk || true
          du -h app/build/outputs/apk/release/AVBox_release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AVBox-1.4.0-screen-off-on-pause
          path: app/build/outputs/apk/release/AVBox_release.apk
          if-no-files-found: error
